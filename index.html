<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Service NSW - Digital Licence</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#121212">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #121212;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 420px;
            background: #1a1a1a;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }
        .header {
            background: #2d2d2d;
            padding: 20px;
            text-align: center;
            color: #fff;
        }
        .license-card {
            background: linear-gradient(135deg, #1e1e2e 0%, #2d2d3d 100%);
            padding: 30px 20px;
            margin: 20px;
            border-radius: 15px;
            color: #fff;
        }
        .license-info {
            margin-bottom: 20px;
        }
        .license-info h2 {
            font-size: 14px;
            opacity: 0.7;
            margin-bottom: 5px;
        }
        .license-info p {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 15px;
        }
        .qr-section {
            text-align: center;
            background: #fff;
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
        }
        #qrCanvas {
            width: 150px;
            height: 150px;
            image-rendering: pixelated;
        }
        .refresh-info {
            text-align: center;
            font-size: 12px;
            color: #aaa;
            margin-top: 10px;
        }
        .refresh-btn {
            width: 100%;
            padding: 12px;
            background: #007AFF;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 15px;
        }
        .refresh-btn:active {
            background: #0051d5;
        }
        .footer {
            text-align: center;
            padding: 15px;
            color: #888;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🇦🇺 Service NSW</h1>
            <p style="font-size: 12px; opacity: 0.7; margin-top: 5px;">Digital Driver Licence</p>
        </div>
        
        <div class="license-card">
            <div class="license-info">
                <h2>Name</h2>
                <p>John DOE</p>
            </div>
            
            <div class="license-info">
                <h2>Licence Number</h2>
                <p>12345678</p>
            </div>
            
            <div class="qr-section">
                <canvas id="qrCanvas" width="150" height="150"></canvas>
                <div class="refresh-info">
                    Refreshed: <span id="refreshTime">just now</span>
                </div>
            </div>
            
            <button class="refresh-btn" onclick="refreshQR()">🔄 Refresh QR Code</button>
            <p style="font-size: 11px; margin-top: 10px; opacity: 0.6; text-align: center;">
                Swipe up on the card or tap Refresh to cycle QR codes
            </p>
        </div>
        
        <div class="footer">
            <p>Digital Licence Holder</p>
            <p>Expires: 01 Jan 2030</p>
        </div>
    </div>

    <script>
        // QR Code Generator
        const canvas = document.getElementById('qrCanvas');
        const ctx = canvas.getContext('2d');
        const qrCodes = ['qr-code-0.png', 'qr-code-1.png', 'qr-code-2.png', 'qr-code-3.png'];
        let currentIndex = 0;
        let touchStartY = 0;

        function generateQRPattern(seed) {
            const size = 150;
            const moduleCount = 21;
            const moduleSize = size / moduleCount;
            
            // Clear and fill white
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, size, size);
            
            // Draw black modules
            ctx.fillStyle = '#000000';
            for (let y = 0; y < moduleCount; y++) {
                for (let x = 0; x < moduleCount; x++) {
                    // Finder patterns (corners)
                    if ((x < 7 && y < 7) || (x >= moduleCount - 7 && y < 7) || (x < 7 && y >= moduleCount - 7)) {
                        if (x === 0 || x === 6 || y === 0 || y === 6 || (x >= 2 && x <= 4 && y >= 2 && y <= 4)) {
                            ctx.fillRect(x * moduleSize, y * moduleSize, moduleSize, moduleSize);
                        }
                    } else {
                        // Data area - pseudo-random based on seed
                        const val = (x * 13 + y * 17 + seed * 19) % 17;
                        if ((val + (x + y + seed) % 5) % 2 === 0) {
                            ctx.fillRect(x * moduleSize, y * moduleSize, moduleSize, moduleSize);
                        }
                    }
                }
            }
        }

        function refreshQR() {
            currentIndex = (currentIndex + 1) % qrCodes.length;
            const seed = Date.now() + currentIndex;
            generateQRPattern(seed);
            
            const now = new Date();
            const time = now.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
            document.getElementById('refreshTime').textContent = time;
        }

        // Swipe detection
        document.addEventListener('touchstart', (e) => {
            touchStartY = e.touches[0].clientY;
        }, false);

        document.addEventListener('touchend', (e) => {
            const touchEndY = e.changedTouches[0].clientY;
            const deltaY = touchStartY - touchEndY;
            if (deltaY > 50) {
                refreshQR();
            }
        }, false);

        // Initialize
        refreshQR();

        // Auto-refresh every 4 seconds
        setInterval(refreshQR, 4000);

        // Service worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch(() => {});
            });
        }
    </script>
</body>
</html>
